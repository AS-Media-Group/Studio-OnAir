# Builds OnAirBridge.exe on GitHub's Windows machines.
# Run it: Actions > "Build Windows app" > Run workflow (or push a change). The .exe is the "OnAirBridge-windows"
# download at the bottom of the run page. Pushing a tag like v0.1.0 also attaches it to a GitHub Release, or run the workflow on main with
# "release_tag" filled in (e.g. v0.1.0) to create the tag and Release without using git.
name: Build Windows app
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: a version like v0.1.0. Creates that tag on the chosen branch and publishes a Release with the .exe."
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest -v
      - run: python onair_icon.py onair.ico
      - run: >
          pyinstaller --noconfirm --onefile --windowed --name OnAirBridge --icon onair.ico
          --hidden-import mido.backends.rtmidi --hidden-import rtmidi
          --hidden-import serial.tools.list_ports_windows --hidden-import pystray._win32
          onair_gui.py
      - uses: actions/upload-artifact@v7
        with:
          name: OnAirBridge-windows
          path: dist/OnAirBridge.exe
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/OnAirBridge.exe
