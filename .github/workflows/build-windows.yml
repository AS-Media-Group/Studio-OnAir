# Builds OnAirBridge.exe on GitHub's Windows machines.
# Run it: Actions > "Build Windows app" > Run workflow (or push a change). The .exe is the "OnAirBridge-windows"
# download at the bottom of the run page. Pushing a tag like v0.1.0 also attaches it to a GitHub Release.
name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest -v
      - run: >
          pyinstaller --noconfirm --onefile --windowed --name OnAirBridge
          --hidden-import mido.backends.rtmidi --hidden-import rtmidi
          --hidden-import serial.tools.list_ports_windows --hidden-import pystray._win32
          onair_gui.py
      - uses: actions/upload-artifact@v7
        with:
          name: OnAirBridge-windows
          path: dist/OnAirBridge.exe
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/OnAirBridge.exe
